services:
  mongo:
    image: mongo:6
    container_name: interview_ai_mongo
    restart: unless-stopped

    ports:
      - "27017:27017"

    volumes:
      - mongo-data:/data/db

    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: interview_ai_backend
    restart: unless-stopped

    # Load environment variables from backend/.env
    env_file:
      - ./backend/.env

    ports:
      - "5000:5000"

    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/interview_ai

    depends_on:
      mongo:
        condition: service_healthy

    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1:5000/health" ]
      interval: 15s
      timeout: 5s
      retries: 3

    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: interview_ai_frontend
    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      - backend

    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mongo-data:
